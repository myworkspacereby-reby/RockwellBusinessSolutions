# Netlify Configuration for Rockwell Business Solutions (Vite + React Static SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Client-side SPA routing redirect: ensures direct page links and refreshes never 404
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache-control headers for static Vite assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
